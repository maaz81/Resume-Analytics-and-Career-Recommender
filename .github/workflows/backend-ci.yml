name: Backend CI

on:
  workflow_dispatch:

  push:
    branches: ["maaz"]
    paths:
      - "career-ai-backend/**"

  pull_request:
    branches: ["maaz"]
    paths:
      - "career-ai-backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./career-ai-backend

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: career-ai-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint
        continue-on-error: true

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key