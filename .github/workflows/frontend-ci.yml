name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'career-ai-frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'career-ai-frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./career-ai-frontend

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./career-ai-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint
      continue-on-error: true # Don't block pipeline on lint warnings

    - name: Build production bundle
      run: npm run build
