services:

  postgres:
    image: postgres:16-alpine
    container_name: career-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: career_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d career_ai_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: career-ai-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: ./career-ai-ml-services

    container_name: career-ai-ml
    restart: unless-stopped

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./career-ai-backend

    container_name: career-ai-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      API_VERSION: v1

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: career_ai_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_ENABLED: "true"

      # ML service
      AI_PARSER_URL: http://ml:8000
      AI_ATS_URL: http://ml:8000
      AI_SKILLS_URL: http://ml:8000
      AI_CHAT_URL: http://ml:8000

      # Frontend
      FRONTEND_URL: http://localhost

    env_file:
      - ./career-ai-backend/.env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      ml:
        condition: service_started

    volumes:
      - resume_uploads:/app/uploads
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./career-ai-frontend

    container_name: career-ai-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  resume_uploads:
  backend_logs:
